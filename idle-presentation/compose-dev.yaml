version: '3.8'

services:
  spring:
    image: public.ecr.aws/${ECR_REGISTRY_ALIAS}/caremeet:${VERSION:-latest}
    volumes:
      - spring-volume:/path/to/spring/data  # 스프링 전용 볼륨
    environment:
      - VERSION=${VERSION:-latest}
      - SPRING_PROFILES_ACTIVE=dev
    pull_policy: always
    env_file:
      - .env
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - redis
    networks:
      - caremeet-net

  mysql:
    image: mysql:8.0.33
    container_name: mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: >
      bash -c "docker-entrypoint.sh mysqld &
               sleep 10 && 
               mysql -u root -p${DB_PASSWORD} -e 'CREATE DATABASE IF NOT EXISTS \`caremeet\`;' &&
               mysql -u root -p${DB_PASSWORD} -e 'CREATE DATABASE IF NOT EXISTS \`caremeet-dev\`;' &&
               wait"
    ports:
      - "3306:3306"
    volumes:
      - mysql-volume:/var/lib/mysql  # MySQL 전용 볼륨
    networks:
      - caremeet-net

  redis:
    image: redis:7.2.5
    container_name: redis_dev
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "redis-server", "--requirepass", "$REDIS_PASSWORD" ]
    volumes:
      - redis-volume:/data
    restart: unless-stopped
    networks:
      - caremeet-net

networks:
  caremeet-net:
    driver: bridge

volumes:
  mysql-volume:
  redis-volume:
  spring-volume:  # 스프링 전용 볼륨 정의
